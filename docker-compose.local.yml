# 로컬 확인용 덧붙임 설정.
#
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up -d
#
# 기본 구성은 호스트로 포트를 하나도 내보내지 않는다. 밖에서 오는 연결은 전부
# cloudflared 가 아웃바운드로 받기 때문이다. 브라우저로 직접 열어보려면 이 파일로
# 포트를 덧붙인다. 서버 배포에는 쓰지 않는다.

services:
  unbound:
    ports:
      - "127.0.0.1:8053:8053"   # DoH 종단
      - "127.0.0.1:5353:53/udp" # DNS 직접 질의 (53 은 systemd-resolved 가 쓰므로 5353)
      - "127.0.0.1:9101:9101"   # 판별 모듈 지표

  api:
    ports:
      - "127.0.0.1:5000:5000"

  prometheus:
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    ports:
      - "127.0.0.1:3000:3000"
