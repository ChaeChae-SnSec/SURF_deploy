# SURF Unbound 설정.

server:
    interface: 0.0.0.0
    port: 53
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes

    # 컨테이너가 이미 격리 경계다. unbound 자체 chroot 와 권한 분리를 끄지 않으면
    # 파이썬 모듈이 /srv 의 모델 파일을 읽지 못한다.
    username: ""
    chroot: ""
    directory: "/opt/unbound"
    logfile: ""
    use-syslog: no
    verbosity: 1

    # DoH 프록시가 토큰마다 배정한 127.x.y.z 를 소스로 질의한다.
    # 이 대역을 막으면 클라이언트 식별이 통째로 죽는다.
    access-control: 127.0.0.0/8 allow
    access-control: 172.16.0.0/12 allow
    access-control: 10.0.0.0/8 allow
    access-control: 0.0.0.0/0 refuse

    cache-min-ttl: 60
    cache-max-ttl: 3600
    prefetch: yes
    msg-cache-size: 64m
    rrset-cache-size: 128m
    num-threads: 2

    # 판별 모듈이 iterator 보다 먼저 질의를 본다.
    #
    # DNSSEC 검증(validator)은 넣지 않았다. 차단 시 응답을 직접 만들어 돌려주는
    # 구조라 검증 모듈과 상호작용이 하나 늘고, 루트 트러스트 앵커 갱신이라는
    # 실패 지점도 생긴다. 필요하면 "python validator iterator" 로 바꾸고
    # auto-trust-anchor-file 을 잡으면 된다.
    module-config: "python iterator"

python:
    python-script: "/srv/app/SURF_dns_server/surf_unbound.py"

# 정상으로 판별된 질의는 상용 리졸버로 넘긴다. 기관 네트워크에서 직접 재귀 질의가
# 막히는 경우가 있어 포워딩이 더 안정적이다.
forward-zone:
    name: "."
    forward-tls-upstream: yes
    forward-addr: 1.1.1.1@853#cloudflare-dns.com
    forward-addr: 1.0.0.1@853#cloudflare-dns.com
    forward-addr: 8.8.8.8@853#dns.google
