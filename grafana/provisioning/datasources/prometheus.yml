apiVersion: 1

# 이름은 같은데 uid 가 바뀌면 갱신 대상을 못 찾아 기동이 실패한다.
# 먼저 지우고 다시 만들어 어느 상태에서 시작하든 같은 결과가 되게 한다.
deleteDatasources:
  - name: Prometheus
    orgId: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: surf-prom
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
